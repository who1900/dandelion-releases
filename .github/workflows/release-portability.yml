name: release-portability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install immutable public rc19 (no source installation)
        run: python -m pip install "https://github.com/who1900/dandelion-releases/releases/download/v1.0.0rc19/dandelion_memory-1.0.0rc19-py3-none-any.whl#sha256=b4400d6ba00a4e4b87338e7414ed8c72ad782fc86eaa1c7a2081271680edbfc4"
      - run: python -m pip check
      - name: Native stdio reconnect and Studio delivery
        run: python -I ci/check_installed_release.py
