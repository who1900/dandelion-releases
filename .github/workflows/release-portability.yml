name: release-portability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install immutable public rc15 (no source installation)
        run: python -m pip install "https://github.com/who1900/dandelion-releases/releases/download/v1.0.0rc15/dandelion-1.0.0rc15-py3-none-any.whl#sha256=6e4e051641ecb6df3328eb402e20a86e939a9d6509f0ac10d76dd261fd022e4c"
      - run: python -m pip check
      - name: Native stdio reconnect and Studio delivery
        run: python -I ci/check_installed_release.py
