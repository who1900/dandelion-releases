name: release-portability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install immutable public rc21 (no source installation)
        run: python -m pip install "https://github.com/who1900/dandelion-releases/releases/download/v1.0.0rc21/dandelion_memory-1.0.0rc21-py3-none-any.whl#sha256=49d279dd24605051a78caa15d4b862e82e6cad6fc50928304e716c69519b42a0"
      - run: python -m pip check
      - name: Native stdio reconnect and Studio delivery
        run: python -I ci/check_installed_release.py
