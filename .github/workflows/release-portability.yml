name: release-portability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install immutable public rc16 (no source installation)
        run: python -m pip install "https://github.com/who1900/dandelion-releases/releases/download/v1.0.0rc16/dandelion_memory-1.0.0rc16-py3-none-any.whl#sha256=9d67d312dbbbc1153a1fcd2d90dd927c155a44c3f8a1e3894b638397b963ebe1"
      - run: python -m pip check
      - name: Native stdio reconnect and Studio delivery
        run: python -I ci/check_installed_release.py
